<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웨딩 준비 타임라인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --cream:#FBF7F2;
    --paper:#FFFFFF;
    --rose:#E5B3AC;
    --rose-deep:#C98A82;
    --rose-text:#C0827B;
    --ink:#4A4340;
    --ink-soft:#6E6461;
    --line:#EDE3DA;
    --tan:#C3A484;
    --tan-soft:#F1E7DA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    font-family:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding:36px 16px 60px;
  }
  .sheet{max-width:1060px;margin:0 auto;}

  /* ── toolbar ── */
  .toolbar{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
    margin-bottom:28px;
  }
  .toolbar button{
    font-family:inherit;font-size:13px;font-weight:600;color:var(--rose-text);
    background:var(--paper);border:1px solid var(--line);border-radius:999px;
    padding:8px 16px;cursor:pointer;transition:.15s;
  }
  .toolbar button:hover{background:var(--rose);border-color:var(--rose);color:#fff;}
  .toolbar button:focus-visible{outline:2px solid var(--rose-deep);outline-offset:2px;}

  /* ── header ── */
  .status{
    text-align:center;font-size:11.5px;color:#BFB3AD;margin:-18px 0 22px;min-height:15px;
  }
  .status.warn{color:#C98A82;}
  .mark{
    width:52px;height:52px;margin:0 auto 18px;border:1px solid var(--rose);
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:var(--rose-deep);font-size:17px;
  }
  h1{
    text-align:center;font-size:31px;font-weight:800;letter-spacing:-.02em;
    margin:0 0 10px;color:#3F3936;
  }
  .sub{text-align:center;font-size:13.5px;color:#9C918C;margin:0 0 30px;}

  /* ── board (데스크톱: 표 모양 grid) ── */
  .board{background:var(--paper);border-radius:6px;overflow:hidden;}
  .bhead,.row{display:grid;grid-template-columns:132px 1fr 1fr 1fr;}
  .bhead>div{
    background:var(--rose);color:#fff;font-size:13.5px;font-weight:700;
    padding:14px 18px;letter-spacing:.01em;
  }
  .bhead>div:first-child{text-align:center;}
  .row{border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .day{
    text-align:center;background:#FEFCFA;border-right:1px solid var(--line);
    padding:20px 10px 16px;
  }
  .day-label{font-size:20px;font-weight:800;color:var(--rose-text);letter-spacing:-.01em;outline:none;border-radius:3px;}
  .day-sub{font-size:11.5px;color:#A79C97;margin-top:5px;outline:none;border-radius:3px;}
  .day-label:focus,.day-sub:focus{background:#FDF3EF;box-shadow:0 0 0 2px #FDF3EF;}
  .day-progress{font-size:11px;font-weight:700;color:var(--rose-text);margin-top:7px;}
  .cell{padding:16px 18px;min-width:0;}
  .cellhead{display:none;}

  /* ── items ── */
  ul.items{list-style:none;margin:0;padding:0;}
  li.item{
    display:flex;align-items:flex-start;gap:8px;
    padding:3.5px 0;position:relative;
  }
  li.item input[type=checkbox]{
    appearance:none;-webkit-appearance:none;
    width:16px;height:16px;margin:2px 0 0;flex:none;
    border:1.5px solid #E3CEC9;border-radius:4px;background:#fff;cursor:pointer;
  }
  li.item input[type=checkbox]:hover{border-color:var(--rose-deep);}
  li.item input[type=checkbox]:checked{background:var(--rose);border-color:var(--rose);}
  li.item input[type=checkbox]:checked::after{
    content:"";display:block;width:4px;height:8px;margin:1px 0 0 4.5px;
    border:solid #fff;border-width:0 1.8px 1.8px 0;transform:rotate(43deg);
  }
  li.item input[type=checkbox]:focus-visible{outline:2px solid var(--rose-deep);outline-offset:2px;}
  .txt{
    font-size:13.5px;line-height:1.55;color:var(--ink-soft);
    flex:1;min-width:0;outline:none;border-radius:3px;
  }
  li.item.key .txt{font-weight:700;color:#453E3B;}
  .txt:focus{background:#FDF3EF;box-shadow:0 0 0 2px #FDF3EF;}
  li.item.done .txt{color:#BDB3AE;text-decoration:line-through;text-decoration-color:#E3D6D1;}

  .badge{
    flex:none;margin-top:1px;font-size:10.5px;font-weight:700;color:#fff;
    background:var(--tan);border-radius:999px;padding:2.5px 8px;letter-spacing:.02em;
  }
  li.item:not(.key) .badge{display:none;}

  /* ── tip ── */
  .tip{
    margin:7px 0 2px;font-size:12.5px;line-height:1.6;color:#A08D80;
  }
  .tip .tip-label{
    display:inline-block;font-size:10.5px;font-weight:800;color:#B08D63;
    background:var(--tan-soft);border-radius:4px;padding:2px 7px;margin-right:7px;
    vertical-align:1px;
  }
  .tip .tip-txt{outline:none;border-radius:3px;}
  .tip .tip-txt:focus{background:#FBF2E8;box-shadow:0 0 0 2px #FBF2E8;}
  .dash{color:#CFC5C0;font-size:14px;}

  /* ── row controls (screen only) ── */
  .tools{
    display:flex;gap:4px;opacity:0;transition:.12s;
    position:absolute;right:0;top:1px;background:var(--paper);padding-left:6px;
  }
  li.item:hover .tools,li.item:focus-within .tools{opacity:1;}
  .tools button{
    font-family:inherit;border:none;background:none;cursor:pointer;
    font-size:11px;color:#C6B8B2;padding:2px 4px;border-radius:3px;line-height:1;
  }
  .tools button:hover{color:var(--rose-deep);background:#FBF1ED;}
  .add-item{
    font-family:inherit;font-size:11.5px;color:#CDC0BA;background:none;border:none;
    padding:5px 0 0;cursor:pointer;opacity:0;transition:.12s;
  }
  .cell:hover .add-item,.cell:focus-within .add-item{opacity:1;}
  .add-item:hover{color:var(--rose-deep);}
  .row-tools{
    margin-top:8px;opacity:0;transition:.12s;
  }
  .row:hover .row-tools{opacity:1;}
  .row-tools button{
    font-family:inherit;font-size:11px;color:#C6B8B2;background:none;border:none;
    cursor:pointer;padding:2px 5px;border-radius:3px;
  }
  .row-tools button:hover{color:var(--rose-deep);background:#FBF1ED;}

  .foot{text-align:center;font-size:12.5px;color:#A79C97;margin-top:26px;}

  /* ── 모바일: 날짜별 카드 스택 ── */
  @media (max-width:760px){
    body{padding:20px 10px 40px;}
    h1{font-size:24px;}
    .bhead{display:none;}
    .board{background:none;border-radius:0;overflow:visible;}
    .row{
      display:block;background:var(--paper);border:1px solid var(--line);
      border-radius:12px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.04);
    }
    .row:last-child{border-bottom:1px solid var(--line);}
    .day{
      display:flex;align-items:baseline;gap:10px;text-align:left;
      border-right:none;border-bottom:1px solid var(--line);
      padding:13px 16px;border-radius:12px 12px 0 0;
    }
    .day-label{font-size:18px;}
    .day-sub{margin-top:0;font-size:12px;}
    .day-progress{margin:0 0 0 auto;font-size:12px;}
    .cell{padding:12px 16px 10px;}
    .cell.empty{display:none;}
    .cellhead{
      display:block;font-size:11.5px;font-weight:800;color:var(--tan);
      margin:0 0 4px;letter-spacing:.04em;
    }
    li.item{min-height:44px;align-items:flex-start;gap:11px;padding:7px 0;}
    li.item input[type=checkbox]{width:22px;height:22px;margin-top:1px;border-radius:6px;border-width:2px;}
    li.item input[type=checkbox]:checked::after{
      width:5.5px;height:11px;margin:2.5px 0 0 6.5px;border-width:0 2.2px 2.2px 0;
    }
    .txt{font-size:15px;line-height:1.6;padding-top:2px;}
    .tip{font-size:13px;}
    .tools{display:none;position:static;margin-left:auto;padding-left:8px;background:none;align-self:center;}
    li.item:focus-within .tools{display:flex;opacity:1;}
    .add-item{opacity:1;padding:2px 0 4px;}
    .row-tools{opacity:1;margin:0 0 0 8px;}
    .dash{display:none;}
  }

  /* ── 인쇄 ── */
  @media print{
    body{background:#fff;padding:0;}
    .toolbar,.status,.tools,.add-item,.row-tools{display:none !important;}
    .board{border:1px solid var(--line);border-radius:0;}
    .bhead{display:grid;}
    .row{display:grid;grid-template-columns:132px 1fr 1fr 1fr;break-inside:avoid;
      border:none;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;margin:0;}
    .day{display:block;text-align:center;border-right:1px solid var(--line);border-bottom:none;}
    .cell.empty{display:block;}
    .cellhead{display:none;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>

    <button type="button" data-act="print">인쇄 / PDF</button>

  <p class="status" id="status" aria-live="polite"></p>

</div>
